<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RI360 | Race intelligence from 96,223 F1 laps</title>
    <meta
      name="description"
      content="RI360 turns five seasons of Formula 1 timing data into race traces, tyre-degradation models and a strategy simulator. A data and design project by Devarsh."
    />
    <meta property="og:title" content="RI360 | Race intelligence" />
    <meta property="og:description" content="Five seasons of F1 timing data, a fitted pace model and a strategy lab." />
    <meta name="theme-color" content="#d7261e" />
    <link rel="icon" type="image/svg+xml" href="./ri360-mark.svg" />
    <link rel="preload" href="./fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var t = localStorage.getItem("ri360-theme");
        if (t === "paper" || t === "pit") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
