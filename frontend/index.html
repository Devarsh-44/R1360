<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RI360 | Race intelligence from every F1 lap since 2019</title>
    <meta
      name="description"
      content="RI360 turns Formula 1 timing data since 2019 into race traces, tyre-degradation models and a strategy simulator, updated after every race. A data and design project by Devarsh."
    />
    <meta property="og:title" content="RI360 | Race intelligence" />
    <meta property="og:description" content="F1 timing data since 2019, a fitted pace model and a strategy lab, updated after every race." />
    <meta name="theme-color" content="#d7261e" />
    <link rel="icon" type="image/svg+xml" href="./ri360-mark.svg" />
    <script>
      try {
        var t = localStorage.getItem("ri360-theme");
        if (t !== "paper" && t !== "pit") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "pit" : "paper";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
