name: Update race data

# Runs every day. When a Grand Prix has finished since the last run, it downloads
# the race from OpenF1, rebuilds the website data and pushes a commit to main;
# Vercel then redeploys the site. On days without a new race nothing is committed.
# If a finished race is still missing after the update, the run fails, so GitHub
# emails the repository owner.

on:
  schedule:
    # Run every 3 hours at minute 25 (avoiding minute-0 runner traffic spikes).
    # Catches races across all time zones (Europe, Americas, Asia/Australia)
    # as soon as OpenF1 data settles, without waiting up to 24 hours.
    - cron: "25 */3 * * *"
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    name: Fetch new races and rebuild site data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Download new races and rebuild
        run: python data_pipeline/update_site_data.py

      - name: Commit if a race was added
        id: commit
        working-directory: .
        run: |
          # index.json carries a build date, so only count real data changes
          if git diff --quiet -- backend/data frontend/public/data/races && \
             [ -z "$(git ls-files --others --exclude-standard backend/data frontend/public/data)" ]; then
            echo "No new races."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data frontend/public/data
          # race files added in this commit = the races the app should announce
          new=$(git diff --cached --name-only --diff-filter=A -- 'frontend/public/data/races/*.json' | sed -E 's#.*/([0-9]+)\.json#\1#' | tr '\n' ' ')
          echo "races=$new" >> "$GITHUB_OUTPUT"
          git commit -m "Update race data ($(date -u +%Y-%m-%d))"
          git push

      # The app's "race analysed" push: waits for Vercel to serve the new race, then sends one
      # message to the Firebase topic. Without the FIREBASE_SERVICE_ACCOUNT secret it only logs it.
      - name: Notify app users
        if: steps.commit.outputs.races != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install google-auth requests
          python data_pipeline/notify_new_races.py ${{ steps.commit.outputs.races }}
